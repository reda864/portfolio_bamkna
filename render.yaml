services:
  - type: web
    name: baamakna-portfolio
    runtime: node
    plan: free
    region: frankfurt # or oregon / ohio
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard from your Neon Console
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure secret
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # Set your desired admin password in Render Dashboard
